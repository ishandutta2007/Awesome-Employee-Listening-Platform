<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-gradient); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes pulse-wave {
      0% { transform: scale(0.96); opacity: 0.3; }
      50% { transform: scale(1.04); opacity: 0.8; }
      100% { transform: scale(0.96); opacity: 0.3; }
    }
    @keyframes float-pill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes bar-grow {
      0% { height: 20px; y: 260px; }
      50% { height: 65px; y: 215px; }
      100% { height: 20px; y: 260px; }
    }
    .animated-wave { transform-origin: center; animation: pulse-wave 6s ease-in-out infinite; }
    .float-1 { animation: float-pill 4s ease-in-out infinite; }
    .float-2 { animation: float-pill 5s ease-in-out infinite 1s; }
    .float-3 { animation: float-pill 4.5s ease-in-out infinite 0.5s; }
    .bar-anim-1 { animation: bar-grow 3.5s ease-in-out infinite; }
    .bar-anim-2 { animation: bar-grow 4.2s ease-in-out infinite 0.7s; }
    .bar-anim-3 { animation: bar-grow 3.8s ease-in-out infinite 1.4s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Dynamic Background Grid / Waves (Behind text) -->
  <g opacity="0.15">
    <circle cx="600" cy="180" r="280" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6" class="animated-wave" />
    <circle cx="600" cy="180" r="210" fill="none" stroke="#38bdf8" stroke-width="1" class="animated-wave" />
  </g>

  <!-- Background decorative bar chart (Right side, behind text overlay zone) -->
  <g opacity="0.25">
    <rect x="940" y="220" width="18" height="60" rx="4" fill="#38bdf8" class="bar-anim-1" />
    <rect x="970" y="190" width="18" height="90" rx="4" fill="#818cf8" class="bar-anim-2" />
    <rect x="1000" y="240" width="18" height="40" rx="4" fill="#c084fc" class="bar-anim-3" />
    <rect x="1030" y="200" width="18" height="80" rx="4" fill="#38bdf8" class="bar-anim-1" />
  </g>

  <!-- Content Container Card -->
  <rect x="50" y="40" width="1100" height="280" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Floating Feature Pills (Positioned safely around main text) -->
  <g class="float-1">
    <rect x="80" y="70" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="160" y="91" text-anchor="middle" class="badge-text">📊 Pulse Surveys</text>
  </g>
  
  <g class="float-2">
    <rect x="260" y="70" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="345" y="91" text-anchor="middle" class="badge-text">💡 Continuous Listening</text>
  </g>

  <g class="float-3">
    <rect x="450" y="70" width="150" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="525" y="91" text-anchor="middle" class="badge-text">📈 eNPS Analytics</text>
  </g>

  <g class="float-1">
    <rect x="940" y="70" width="170" height="32" rx="16" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" />
    <text x="1025" y="91" text-anchor="middle" class="badge-text">🔓 Self-Hostable OS</text>
  </g>

  <!-- Main Foreground Header Text (Guaranteed clear visibility) -->
  <text x="80" y="175" class="title" filter="url(#glow)">Awesome Employee Listening Platform</text>
  <text x="80" y="225" class="subtitle">The Definitive Landscape of SaaS &amp; Open-Source Employee Engagement, Pulse Surveys &amp; People Analytics</text>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(80, 260)">
    <text x="0" y="20" font-family="system-ui" font-size="14" font-weight="600" fill="#38bdf8">🏢 Enterprise SaaS Benchmarks</text>
    <text x="260" y="20" font-family="system-ui" font-size="14" font-weight="600" fill="#818cf8">⚡ Open-Source Stack Alternatives</text>
    <text x="540" y="20" font-family="system-ui" font-size="14" font-weight="600" fill="#c084fc">🔒 Privacy &amp; Local AI Analysis</text>
  </g>
</svg>
